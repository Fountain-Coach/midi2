name: compliance-swift

on:
  push:
  pull_request:

jobs:
  compliance_swift:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run local compliance runner
        run: |
          swift run midi2compliance --export out/report.json
          python3 midi2-compliance/tools/badge_from_report.py out/report.json out/badge.svg || true
      - name: Upload report
        uses: actions/upload-artifact@v6
        with:
          name: midi2-compliance-swift
          path: |
            out/report.json
            out/badge.svg
