name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run tests
        run: swift test
      - name: Coverage report
        run: |
          swift test --enable-code-coverage
          xcrun llvm-cov report \
            .build/*/debug/MIDI2PackageTests.xctest/Contents/MacOS/MIDI2PackageTests \
            --instr-profile .build/*/debug/codecov/default.profdata \
            --ignore-filename-regex='(Tests/|^\.|/\.)' || true
      - name: Enforce coverage gate (>=80%)
        run: |
          set -e
          swift test --enable-code-coverage
          BIN=$(ls .build/*/debug/MIDI2PackageTests.xctest/Contents/MacOS/MIDI2PackageTests | head -n1)
          PROF=$(ls .build/*/debug/codecov/default.profdata | head -n1)
          REPORT=$(xcrun llvm-cov report "$BIN" --instr-profile "$PROF" --ignore-filename-regex='(Tests/|^\.|/\.)')
          echo "$REPORT"
          # Extract the Lines cover percentage (10th column in TOTAL row)
          PCT=$(echo "$REPORT" | awk '/^TOTAL/{print $10}' | tr -d '%')
          echo "Coverage: ${PCT}%"
          if [ -z "$PCT" ]; then echo "Coverage parse failed"; exit 1; fi
          PCT_INT=${PCT%.*}
          if [ "$PCT_INT" -lt 80 ]; then echo "Coverage below 80%"; exit 1; fi
      - name: Verify DoD docs & VRT-Protocol
        run: |
          python3 Scripts/verify_docs.py
      - name: Verify specification provenance and generated traceability
        run: |
          python3 Scripts/generate_spec_traceability.py --check
          python3 Scripts/verify_spec_provenance.py
          python3 Scripts/generate_normative_source_inventory.py --check
          python3 Scripts/generate_normative_source_dispositions.py --check
          python3 Scripts/generate_normative_coverage.py --check
          python3 Scripts/verify_normative_coverage.py
          python3 -m unittest discover -s Tests -p 'test_spec_provenance.py' -v
          python3 -m unittest discover -s Tests -p 'test_normative_coverage.py' -v
      - name: Verify evidence-backed claim register
        run: |
          python3 Scripts/generate_claim_register.py --check
          python3 Scripts/verify_claims.py
      - name: Verify runtime completeness boundary
        run: |
          python3 Scripts/generate_runtime_completeness.py --check
          python3 Scripts/verify_runtime_completeness.py

  # Keep the repository's protected-branch `test` status contract explicit.
  # The substantive suite runs in build-test; this dependent job exposes the
  # required legacy status name without duplicating the full test workload.
  test:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - name: Protected-branch test gate
        run: echo "build-test passed; protected-branch test gate satisfied"
