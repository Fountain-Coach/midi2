<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MIDI 2.0 Compliance Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
    pre { background: #f6f8fa; padding: 1rem; border-radius: 8px; overflow-x: auto; }
    .status { display:inline-block; padding:.25rem .5rem; border-radius:.5rem; background:#eef; }
  </style>
</head>
<body>
  <h1>MIDI 2.0 Compliance Dashboard</h1>
  <p>This page loads the latest <code>out/report.json</code> if available.</p>
  <div id="status" class="status">Loading…</div>
  <pre id="json"></pre>
  <script>
    fetch('../out/report.json').then(r=>r.json()).then(j=>{
      document.getElementById('status').textContent = 'Loaded report.json';
      document.getElementById('json').textContent = JSON.stringify(j, null, 2);
    }).catch(()=>{
      document.getElementById('status').textContent = 'No report.json found yet.';
    });
  </script>
</body>
</html>
