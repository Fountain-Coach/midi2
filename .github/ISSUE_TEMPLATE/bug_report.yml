name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
      placeholder: Tell us what happened
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Steps to reproduce the behavior
      placeholder: |
        1. Import package with '...'
        2. Call function '...'
        3. Observe error '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen
      placeholder: Expected result...
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior
      description: What actually happened
      placeholder: Actual result...
    validations:
      required: true

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of the repository is affected?
      options:
        - Swift Package (MIDI2, MIDI2CI)
        - JavaScript/TypeScript (midi2.js)
        - Examples
        - Documentation
        - CI/Build System
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: Package version (e.g., 0.7.0, main branch commit hash)
      placeholder: "0.7.0"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS and version
      placeholder: "macOS 13.5, Ubuntu 22.04, Windows 11"
    validations:
      required: true

  - type: input
    id: swift-version
    attributes:
      label: Swift Version (if applicable)
      description: Output of `swift --version`
      placeholder: "Swift version 6.2.1"

  - type: input
    id: node-version
    attributes:
      label: Node.js Version (if applicable)
      description: Output of `node --version`
      placeholder: "v20.10.0"

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Any other context, logs, screenshots, or related issues
      placeholder: |
        Logs:
        ```
        Paste error messages here
        ```

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues to ensure this is not a duplicate
          required: true
        - label: I have tested with the latest version
          required: false
