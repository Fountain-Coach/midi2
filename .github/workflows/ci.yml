name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (warnings as errors)
        run: swift build -Xswiftc -warnings-as-errors
      - name: Run tests
        run: swift test
      - name: Coverage report
        run: |
          swift test --enable-code-coverage
          xcrun llvm-cov report \
            .build/*/debug/MIDI2PackageTests.xctest/Contents/MacOS/MIDI2PackageTests \
            --instr-profile .build/*/debug/codecov/default.profdata \
            --ignore-filename-regex='(Tests/|^\.|/\.)' || true
      - name: Enforce coverage gate (>=80%)
        run: |
          set -e
          swift test --enable-code-coverage
          BIN=$(ls .build/*/debug/MIDI2PackageTests.xctest/Contents/MacOS/MIDI2PackageTests | head -n1)
          PROF=$(ls .build/*/debug/codecov/default.profdata | head -n1)
          REPORT=$(xcrun llvm-cov report "$BIN" --instr-profile "$PROF" --ignore-filename-regex='(Tests/|^\.|/\.)')
          echo "$REPORT"
          # Extract the Lines cover percentage (10th column in TOTAL row)
          PCT=$(echo "$REPORT" | awk '/^TOTAL/{print $10}' | tr -d '%')
          echo "Coverage: ${PCT}%"
          if [ -z "$PCT" ]; then echo "Coverage parse failed"; exit 1; fi
          PCT_INT=${PCT%.*}
          if [ "$PCT_INT" -lt 80 ]; then echo "Coverage below 80%"; exit 1; fi
      - name: Verify DoD docs & PB-VRT
        run: |
          python3 Scripts/verify_docs.py
