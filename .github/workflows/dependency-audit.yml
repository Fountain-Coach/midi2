name: Weekly Dependency Audit

on:
  schedule:
    # Run every Monday at 09:00 UTC
    - cron: '0 9 * * 1'
  workflow_dispatch: # Allow manual trigger

jobs:
  audit-swift:
    name: Swift Dependency Audit
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Swift Package Resolve
        run: swift package resolve

      - name: List Dependencies
        run: |
          echo "## Swift Dependencies" >> $GITHUB_STEP_SUMMARY
          swift package show-dependencies --format json > deps.json 2>&1 || echo "{}" > deps.json
          if [ -s deps.json ] && jq -e '.dependencies' deps.json > /dev/null 2>&1; then
            jq -r '.dependencies[] | "\(.identity) \(.requirement)"' deps.json >> $GITHUB_STEP_SUMMARY
          else
            echo "No dependencies or unable to parse" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for Updates
        run: |
          echo "Running swift package update to check for updates..."
          swift package update
          if git diff --quiet Package.resolved; then
            echo "✅ All Swift dependencies are up to date" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ Swift dependency updates available" >> $GITHUB_STEP_SUMMARY
            echo "Review and create PR if needed" >> $GITHUB_STEP_SUMMARY
          fi

  audit-javascript:
    name: JavaScript Dependency Audit
    runs-on: ubuntu-latest
    strategy:
      matrix:
        directory: [".", "midi2.js"]
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ matrix.directory }}/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: npm audit
        run: |
          echo "## npm Audit Results (${{ matrix.directory }})" >> $GITHUB_STEP_SUMMARY
          npm audit --json > audit.json || true
          if [ -s audit.json ]; then
            # Parse and summarize vulnerabilities
            CRITICAL=$(jq '.metadata.vulnerabilities.critical // 0' audit.json)
            HIGH=$(jq '.metadata.vulnerabilities.high // 0' audit.json)
            MODERATE=$(jq '.metadata.vulnerabilities.moderate // 0' audit.json)
            LOW=$(jq '.metadata.vulnerabilities.low // 0' audit.json)
            
            echo "- Critical: $CRITICAL" >> $GITHUB_STEP_SUMMARY
            echo "- High: $HIGH" >> $GITHUB_STEP_SUMMARY
            echo "- Moderate: $MODERATE" >> $GITHUB_STEP_SUMMARY
            echo "- Low: $LOW" >> $GITHUB_STEP_SUMMARY
            
            if [ "$CRITICAL" -gt 0 ] || [ "$HIGH" -gt 0 ]; then
              echo "::warning::Critical or High severity vulnerabilities found in ${{ matrix.directory }}"
              exit 1
            fi
          else
            echo "✅ No vulnerabilities found" >> $GITHUB_STEP_SUMMARY
          fi

      - name: Check for Outdated Packages
        run: |
          echo "## Outdated Packages (${{ matrix.directory }})" >> $GITHUB_STEP_SUMMARY
          npm outdated --json > outdated.json || true
          if [ -s outdated.json ] && [ "$(cat outdated.json)" != "{}" ]; then
            echo "⚠️ Outdated packages detected" >> $GITHUB_STEP_SUMMARY
            npm outdated >> $GITHUB_STEP_SUMMARY || true
          else
            echo "✅ All packages up to date" >> $GITHUB_STEP_SUMMARY
          fi

  audit-github-actions:
    name: GitHub Actions Version Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Action Versions
        run: |
          echo "## GitHub Actions Used" >> $GITHUB_STEP_SUMMARY
          grep -rh "uses:" .github/workflows/*.yml | sed 's/.*uses: //' | sort -u >> $GITHUB_STEP_SUMMARY || echo "No actions found" >> $GITHUB_STEP_SUMMARY

      - name: Check for Deprecated Actions
        run: |
          echo "## Checking for Deprecated Actions" >> $GITHUB_STEP_SUMMARY
          # List of known deprecated actions (update as needed)
          DEPRECATED="actions/checkout@v2 actions/setup-node@v2"
          for action in $DEPRECATED; do
            if grep -rq "$action" .github/workflows/*.yml; then
              echo "⚠️ Deprecated action found: $action" >> $GITHUB_STEP_SUMMARY
            fi
          done
          echo "✅ Check complete" >> $GITHUB_STEP_SUMMARY
