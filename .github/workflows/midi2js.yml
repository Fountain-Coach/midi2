name: midi2.js CI

on:
  push:
    branches: [main]
    paths:
      - "midi2.js/**"
      - ".github/workflows/midi2js.yml"
  pull_request:
    branches: [main]
    paths:
      - "midi2.js/**"
      - ".github/workflows/midi2js.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midi2.js
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "midi2.js/package-lock.json"
      - run: npm ci
      - run: npm run ci
