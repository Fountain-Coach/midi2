name: midi2-compliance

on:
  push:
  pull_request:

jobs:
  compliance:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    continue-on-error: true
    continue-on-error: ${{ matrix.os == 'macos-14' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install OS deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xvfb python3 make gcc g++ pkg-config \
            libasound2t64 libasound2-dev libusb-1.0-0-dev \
            libnss3 libgtk-3-0 libxss1 libxtst6 libx11-xcb1 libxcb-dri3-0 \
            libdrm2 libgbm1 libxdamage1 libxcomposite1 libxrandr2 \
            libpangocairo-1.0-0 libatk1.0-0 libcups2 libxkbcommon0 libnotify4
          # Fallback for older Ubuntu images where libasound2t64 is not present
          sudo apt-get install -y libasound2 || true
          npm install -g yarn || true
          sudo apt-get install -y jq

      - name: Install OS deps (macOS)
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install yarn pkg-config automake libtool || true

      - name: Install compliance rig
        run: |
          bash midi2-compliance/scripts/install.sh
        env:
          WORKBENCH_FORK_URL: ${{ env.WORKBENCH_FORK_URL || 'https://github.com/Fountain-Coach/MIDI2.0Workbench' }}
      - name: Show workbench dir
        run: |
          ls -la
          ls -la .workbench || true

      - name: Cache Workbench node_modules
        uses: actions/cache@v4
        with:
          path: .workbench/node_modules
          key: ${{ runner.os }}-wb-node-${{ hashFiles('.workbench/package-lock.json', '.workbench/yarn.lock') }}
          restore-keys: |
            ${{ runner.os }}-wb-node-

      - name: Install Workbench deps
        run: |
          cd .workbench
          export ELECTRON_MIRROR=https://artifacts.electronjs.org/
          if [ -f yarn.lock ]; then
            corepack enable || true
            yarn config set network-timeout 600000 -g || true
            for i in 1 2 3; do yarn install --frozen-lockfile && break || sleep 5; done
          else
            npm config set fetch-retry-maxtimeout 600000
            npm config set fetch-retry-mintimeout 20000
            npm ci --ignore-scripts || npm install --no-fund --no-audit
          fi

      - name: Ensure Electron installed
        run: |
          cd .workbench
          export ELECTRON_MIRROR=https://artifacts.electronjs.org/
          RAW_VER=$(node -e "try{let p=require('./package.json');console.log(p.devDependencies?.electron||p.dependencies?.electron||'19.1.9')}catch(e){console.log('19.1.9')}")
          VER=${RAW_VER#^}
          VER=${VER#~}
          echo "Installing electron@${VER}"
          for i in 1 2 3; do npm install -D electron@"$VER" --no-fund --no-audit && break || sleep 5; done

      - name: Electron rebuild (best-effort)
        run: |
          cd .workbench
          RAW_VER=$(node -e "try{let p=require('./package.json');console.log(p.devDependencies?.electron||p.dependencies?.electron||'19.1.9')}catch(e){console.log('19.1.9')}")
          ELECTRON_VER=${RAW_VER#^}
          ELECTRON_VER=${ELECTRON_VER#~}
          echo "Electron version: $ELECTRON_VER"
          npx electron-rebuild -f -v "$ELECTRON_VER" || true
        env:
          npm_config_python: python3
          npm_config_build_from_source: false
          OPENSSL_FIPS: ""
          npm_config_runtime: electron

      - name: Start virtual endpoints (optional stub)
        run: |
          echo "TODO: Start midi2 device or virtual endpoints if needed"

      - name: Run Workbench headless
        run: |
          bash midi2-compliance/scripts/run_local.sh
        env:
          MIDI2_LOG_CONSOLE: '1'
          MIDI2_START_SELECTOR: '#start-tests'
          MIDI2_EXPORT_SELECTOR: '#export-json'
          WORKBENCH_DIR: .workbench

      - name: Upload compliance report
        uses: actions/upload-artifact@v4
        with:
          name: midi2-compliance-${{ matrix.os }}
          path: |
            out/report.json
            out/workbench.log

      - name: Generate badge
        run: |
          python3 midi2-compliance/tools/badge_from_report.py out/report.json out/badge.svg || true

      - name: Upload badge
        uses: actions/upload-artifact@v4
        with:
          name: midi2-badge-${{ matrix.os }}
          path: out/badge.svg
