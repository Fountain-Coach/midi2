name: midi2.js CI

on:
  push:
    paths:
      - "midi2.js/**"
      - ".github/workflows/midi2-js.yml"
  pull_request:
    paths:
      - "midi2.js/**"
      - ".github/workflows/midi2-js.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: midi2.js
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: midi2.js/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Test
        run: npm test -- --runInBand=false

      - name: Build
        run: npm run build

      - name: Coverage
        run: npm run coverage -- --runInBand=false
